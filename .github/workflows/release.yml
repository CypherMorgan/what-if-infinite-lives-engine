name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Verify
        run: |
          npm run typecheck
          npm run lint
          npm run format:check
          npm test

      # Package only. electron-builder still writes latest.yml and the blockmap
      # because a publish provider is configured, but it must not create the
      # GitHub release itself: it opens a separate release per asset batch, which
      # produced duplicate v1.0.0 releases. Publishing is done in one step below.
      - name: Package Windows builds
        run: npm run package:win

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
          if-no-files-found: error

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          # The installers plus the auto-update metadata (latest.yml) and
          # blockmap that electron-updater needs. All attached to a single
          # release in one atomic step.
          files: |
            release/*.exe
            release/latest.yml
            release/*.blockmap
          fail_on_unmatched_files: true
          generate_release_notes: true
